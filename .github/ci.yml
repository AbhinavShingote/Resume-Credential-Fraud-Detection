# .github/workflows/ci.yml
# VisiVerify CI/CD pipeline — DevOps tool #2 of 3.
# Maps to PMP §7.3 "CI/CD pipeline setup (GitHub Actions)".
#
# Triggers:
#   - Any push to main or develop
#   - Any pull request targeting main
#
# Jobs run in parallel where possible for speed.

name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # =========================================================
  #  Job 1: Backend tests (pytest + coverage)
  # =========================================================
  backend-test:
    name: Backend · pytest + coverage
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL for the tests — same as production
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fraud_user
          POSTGRES_PASSWORD: fraud_pass
          POSTGRES_DB: fraud_detection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Tesseract, Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libgl1

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run 25 pytest test cases with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://fraud_user:fraud_pass@localhost:5432/fraud_detection_test
          JWT_SECRET: test-secret-key-for-ci
        run: |
          pytest -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # =========================================================
  #  Job 2: Frontend build check
  # =========================================================
  frontend-build:
    name: Frontend · Vite build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # =========================================================
  #  Job 3: Docker image build (main branch only)
  # =========================================================
  docker-build:
    name: Docker · build all images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          tags: visiverify-backend:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          tags: visiverify-frontend:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max